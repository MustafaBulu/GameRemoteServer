<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PC Broadcaster</title>
  <style>
    :root {
      --bg: #0a1220;
      --card: #121d31;
      --border: #24344f;
      --text: #ecf3ff;
      --muted: #94a8c6;
      --accent-1: #22d3ee;
      --accent-2: #34d399;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 18px;
      font-family: "Segoe UI", "Inter", sans-serif;
      color: var(--text);
      background:
        radial-gradient(800px 380px at 0% -10%, #1e293b, transparent 60%),
        radial-gradient(700px 400px at 100% 0%, #083344, transparent 60%),
        var(--bg);
      min-height: 100vh;
    }
    .wrap {
      max-width: 980px;
      margin: 0 auto;
      display: grid;
      gap: 12px;
    }
    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .title { font-size: 22px; font-weight: 700; }
    .status {
      font-size: 12px;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 10px;
    }
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 8px;
    }
    input, button {
      width: 100%;
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 10px 12px;
      font-size: 15px;
      color: var(--text);
      background: #0f1a2c;
    }
    button {
      border: none;
      color: #052015;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    }
    video {
      width: 100%;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #060b15;
      display: block;
    }
    .log {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.35;
      white-space: pre-wrap;
      background: #0a1120;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      min-height: 96px;
      max-height: 160px;
      overflow: auto;
      color: #d7e3fa;
    }
    @media (max-width: 680px) {
      .controls { grid-template-columns: 1fr; }
      .top { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="card">
      <div class="top">
        <div class="title">PC Broadcaster</div>
        <div id="status" class="status">Idle</div>
      </div>
      <div class="controls">
        <input id="code" value="123456" placeholder="Pair Code (6 digits)" />
        <input id="token" value="ABCD1234" placeholder="Token" />
        <button id="start">Start Broadcast</button>
      </div>
    </section>

    <section class="card">
      <video id="preview" autoplay muted playsinline></video>
    </section>

    <section class="card">
      <div id="log" class="log"></div>
    </section>
  </div>

  <script>
    const logEl = document.getElementById("log");
    const statusEl = document.getElementById("status");
    const log = (...a) => { logEl.textContent += a.join(" ") + "\n"; logEl.scrollTop = logEl.scrollHeight; };
    const setStatus = (s) => { statusEl.textContent = s; };

    let ws;
    let pc;
    let inputChannel;
    let code = "";
    let token = "";
    let agentWs = null;
    let captureStream = null;
    let reconnectTimer = null;
    let reconnectAttempt = 0;
    let started = false;
    let wsConnId = 0;
    let restarting = false;
    let renegotiating = false;

    function wsUrl() {
      const scheme = location.protocol === "https:" ? "wss" : "ws";
      return `${scheme}://${location.host}/ws`;
    }

    async function start() {
      code = document.getElementById("code").value.trim();
      token = document.getElementById("token").value.trim();
      if (!/^\d{6}$/.test(code) || token.length < 4) return log("Invalid code/token.");
      started = true;
      reconnectAttempt = 0;
      connectAgent();
      await ensureCaptureStream();
      await recreatePeer();
      connectSignaling();
    }

    async function ensureCaptureStream() {
      const ended = captureStream && captureStream.getTracks().every((t) => t.readyState === "ended");
      if (!captureStream || ended) {
        captureStream = await navigator.mediaDevices.getDisplayMedia({
          video: { frameRate: { ideal: 60, max: 60 }, width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        });
        document.getElementById("preview").srcObject = captureStream;
        log("Display stream started.");
        bindCaptureLifecycle(captureStream);
      }
    }

    function bindCaptureLifecycle(stream) {
      stream.getVideoTracks().forEach((track) => {
        track.onended = () => {
          if (!started) return;
          log("Display capture ended. Restarting capture...");
          restartPipeline("Capture ended");
        };
      });
    }

    function cleanupPeer() {
      try {
        if (pc) {
          pc.onicecandidate = null;
          pc.onconnectionstatechange = null;
          pc.close();
        }
      } catch {}
      pc = null;
      inputChannel = null;
    }

    async function recreatePeer() {
      cleanupPeer();
      pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
      pc.onicecandidate = (ev) => {
        if (!ev.candidate) return;
        sendWs({ type: "signal", token, target: "android", data: { candidate: ev.candidate } });
      };
      pc.onconnectionstatechange = () => {
        const s = pc.connectionState;
        setStatus("Peer: " + s);
        log("Peer state:", s);
      };
      pc.oniceconnectionstatechange = () => {
        log("ICE state:", pc.iceConnectionState);
      };
      pc.onicegatheringstatechange = () => {
        log("ICE gather:", pc.iceGatheringState);
      };

      inputChannel = pc.createDataChannel("input", {
        ordered: false,
        maxRetransmits: 0
      });
      inputChannel.onopen = () => log("Input channel open.");
      inputChannel.onmessage = (ev) => {
        log("Input:", ev.data);
        if (agentWs && agentWs.readyState === WebSocket.OPEN) {
          agentWs.send(ev.data);
        }
      };
      captureStream.getTracks().forEach((t) => pc.addTrack(t, captureStream));
      setStatus("Broadcasting");
    }

    async function sendFreshOffer(reason) {
      if (!pc) return;
      if (renegotiating) return;
      renegotiating = true;
      try {
        log("Creating offer:", reason);
        const offer = await pc.createOffer({ iceRestart: true });
        await pc.setLocalDescription(offer);
        sendWs({ type: "signal", token, target: "android", data: { sdp: pc.localDescription } });
        log("Offer sent.");
      } finally {
        renegotiating = false;
      }
    }

    function connectSignaling() {
      const connId = ++wsConnId;
      setStatus("Connecting...");
      ws = new WebSocket(wsUrl());
      ws.onopen = async () => {
        if (connId !== wsConnId) return;
        log("WS connected.");
        sendWs({ type: "register", role: "pc", code, token });
      };
      ws.onmessage = async (ev) => {
        if (connId !== wsConnId) return;
        const msg = JSON.parse(ev.data);
        if (msg.type === "registered") {
          reconnectAttempt = 0;
          setStatus("Registered");
          log(`Registered token=${msg.token || token}`);
          if (msg.paired) {
            log("Peer already connected, resetting peer for clean ICE...");
            await recreatePeer();
            await sendFreshOffer("registered_paired");
          }
          return;
        }
        if (msg.type === "peer_connected") {
          log("Android connected, resetting peer for clean ICE...");
          await recreatePeer();
          await sendFreshOffer("peer_connected");
          return;
        }
        if (msg.type === "peer_disconnected") {
          log("Android disconnected.");
          return;
        }
        if (msg.type === "signal" && msg.data?.sdp) {
          await pc.setRemoteDescription(new RTCSessionDescription(msg.data.sdp));
          if (msg.data.sdp.type === "offer") {
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            sendWs({ type: "signal", token, target: "android", data: { sdp: pc.localDescription } });
          }
          return;
        }
        if (msg.type === "signal" && msg.data?.candidate) {
          try { await pc.addIceCandidate(new RTCIceCandidate(msg.data.candidate)); } catch {}
          return;
        }
        if (msg.type === "error") {
          log("ERROR:", msg.message);
          setStatus("Error");
        }
      };
      ws.onclose = () => {
        if (connId !== wsConnId) return;
        setStatus("Disconnected");
        scheduleReconnect("Signaling closed");
      };
      ws.onerror = () => {
        if (connId !== wsConnId) return;
        scheduleReconnect("Signaling error");
      };
    }

    function sendWs(payload) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(payload));
      }
    }

    function scheduleReconnect(reason) {
      if (!started) return;
      if (reconnectTimer) return;
      reconnectAttempt += 1;
      const delay = Math.min(4000, 700 + reconnectAttempt * 300);
      log(reason, `retry in ${delay}ms`);
      reconnectTimer = setTimeout(async () => {
        reconnectTimer = null;
        try {
          await ensureCaptureStream();
          await recreatePeer();
          connectSignaling();
        } catch (e) {
          scheduleReconnect("Reconnect failed: " + e.message);
        }
      }, delay);
    }

    function restartPipeline(reason) {
      if (restarting) return;
      restarting = true;
      log(reason);
      setTimeout(async () => {
        try {
          const old = ws;
          ws = null;
          try { if (old) old.close(); } catch {}
          await ensureCaptureStream();
          await recreatePeer();
          connectSignaling();
        } catch (e) {
          scheduleReconnect("Restart failed: " + e.message);
        } finally {
          restarting = false;
        }
      }, 120);
    }

    document.getElementById("start").onclick = () => start().catch((e) => {
      log("Start failed:", e.message);
      setStatus("Error");
    });

    function connectAgent() {
      try {
        agentWs = new WebSocket("ws://127.0.0.1:40123");
        agentWs.onopen = () => log("PC input agent connected.");
        agentWs.onerror = () => log("PC input agent not reachable. Run: npm run pc:agent");
      } catch {
        log("PC input agent connect failed.");
      }
    }
  </script>
</body>
</html>
