<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Remote Viewer</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap");

    :root {
      --ink: #e7f1ff;
      --muted: #8ca9cd;
      --stroke: rgba(151, 184, 222, 0.3);
      --glass: rgba(7, 17, 31, 0.78);
      --glass-strong: rgba(6, 15, 27, 0.9);
      --warn: #f4b942;
      --ok: #4df7a7;
      --danger: #ff7c9b;
      --shadow: 0 18px 42px rgba(0, 0, 0, 0.42);
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: "Space Grotesk", "Trebuchet MS", sans-serif;
    }

    body {
      background:
        radial-gradient(720px 420px at 0% -12%, rgba(47, 116, 180, 0.42), transparent 60%),
        radial-gradient(660px 400px at 100% -8%, rgba(26, 126, 72, 0.34), transparent 62%),
        #050a13;
    }

    #remote {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: #000;
      display: block;
      touch-action: none;
    }
    .overlay-top {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 55;
      display: block;
      pointer-events: none;
    }
    .banner {
      text-align: center;
      font-size: 13px;
      letter-spacing: 0.01em;
      padding: 9px 12px;
      border-radius: 12px;
      color: var(--ink);
      background: var(--glass);
      border: 1px solid var(--stroke);
      backdrop-filter: blur(7px);
      box-shadow: var(--shadow);
      pointer-events: auto;
    }
    .banner.warn {
      border-color: rgba(180, 120, 24, 0.7);
      background: rgba(42, 24, 7, 0.9);
      color: #ffdfa3;
    }
    .netstats {
      position: fixed;
      top: 12px;
      right: 12px;
      left: auto;
      width: auto;
      max-width: 68vw;
      font-size: 11px;
      line-height: 1.3;
      border-radius: 10px;
      border: 1px solid var(--stroke);
      background: var(--glass);
      color: #cae5ff;
      padding: 5px 8px;
      backdrop-filter: blur(7px);
      font-family: "IBM Plex Mono", "Consolas", monospace;
      box-shadow: var(--shadow);
      pointer-events: auto;
      opacity: 0.9;
    }
    .toast-wrap {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: 86px;
      display: grid;
      gap: 8px;
      pointer-events: none;
      z-index: 50;
    }
    .toast {
      background: var(--glass);
      border: 1px solid var(--stroke);
      border-radius: 12px;
      padding: 10px 12px;
      color: #dbeafd;
      font-size: 12px;
      backdrop-filter: blur(7px);
      box-shadow: var(--shadow);
      animation: fadeOut 2.2s ease forwards;
    }
    .ripple {
      position: fixed;
      width: 22px;
      height: 22px;
      border-radius: 999px;
      border: 2px solid rgba(56, 189, 248, 0.9);
      background: rgba(56, 189, 248, 0.18);
      transform: translate(-50%, -50%) scale(0.4);
      pointer-events: none;
      z-index: 60;
      animation: ripple 420ms ease-out forwards;
    }
    .ripple.right {
      border-color: rgba(244, 185, 66, 0.98);
      background: rgba(244, 185, 66, 0.2);
    }
    .control-dock {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: 10px;
      z-index: 70;
      display: flex;
      justify-content: flex-end;
      pointer-events: none;
    }
    .right-stack {
      display: grid;
      gap: 8px;
      justify-items: end;
    }
    .kbd-toggle {
      width: 52px;
      height: 52px;
      border-radius: 999px;
      border: 1px solid var(--stroke);
      background: var(--glass-strong);
      color: var(--ink);
      display: grid;
      place-items: center;
      box-shadow: var(--shadow);
      pointer-events: auto;
      user-select: none;
      -webkit-user-select: none;
    }
    .snap-btn {
      width: 52px;
      height: 52px;
      border-radius: 999px;
      border: 1px solid var(--stroke);
      background: var(--glass-strong);
      color: var(--ink);
      display: grid;
      place-items: center;
      font-size: 22px;
      font-weight: 600;
      box-shadow: var(--shadow);
      pointer-events: auto;
      user-select: none;
      -webkit-user-select: none;
    }
    .kbd-toggle { font-size: 22px; }
    .kbd-panel {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: 72px;
      z-index: 70;
      display: none;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      padding: 11px;
      border-radius: 14px;
      border: 1px solid var(--stroke);
      background: rgba(8, 17, 30, 0.92);
      backdrop-filter: blur(8px);
      box-shadow: var(--shadow);
    }
    .kbd-panel input, .kbd-panel button {
      height: 42px;
      border-radius: 10px;
      border: 1px solid rgba(139, 174, 212, 0.3);
      background: #0d1a2c;
      color: var(--ink);
      padding: 0 10px;
      font-size: 14px;
      font-family: "Space Grotesk", "Trebuchet MS", sans-serif;
    }
    .kbd-panel button { min-width: 62px; }
    #kbdInput { grid-column: span 4; }
    @keyframes ripple {
      to { transform: translate(-50%, -50%) scale(2.8); opacity: 0; }
    }
    @keyframes fadeOut {
      0% { opacity: 0; transform: translateY(6px); }
      12% { opacity: 1; transform: translateY(0); }
      80% { opacity: 1; }
      100% { opacity: 0; transform: translateY(4px); }
    }
    @media (min-width: 900px) {
      .overlay-top {
        left: 14px;
        right: auto;
        width: min(420px, calc(100vw - 28px));
      }
      .netstats {
        top: 14px;
        right: 14px;
        max-width: 420px;
      }
      .control-dock {
        left: 14px;
        right: 14px;
      }
      .kbd-panel {
        width: min(520px, calc(100vw - 28px));
        right: 14px;
        left: auto;
      }
      .toast-wrap {
        width: min(420px, calc(100vw - 28px));
        right: 14px;
        left: auto;
      }
    }
  </style>
</head>
<body>
  <video id="remote" autoplay playsinline></video>
  <audio id="remoteAudio" autoplay></audio>
  <div class="overlay-top">
    <div id="banner" class="banner">Baglaniyor...</div>
    <div id="netStats" class="netstats">bitrate=- | fps=- | rtt=- | loss=-</div>
  </div>
  <div id="toasts" class="toast-wrap"></div>
  <div class="control-dock">
    <div class="right-stack">
      <button id="snapBtn" class="snap-btn" type="button" aria-label="Take screenshot">&#128247;</button>
      <button id="kbdToggle" class="kbd-toggle" type="button">&#9000;</button>
    </div>
  </div>
  <div id="kbdPanel" class="kbd-panel">
    <input id="kbdInput" type="text" placeholder="Yaz ve gonder" />
    <button id="kbdSend" type="button">Send</button>
  </div>
  <script>
    const toastWrap = document.getElementById("toasts");
    const banner = document.getElementById("banner");
    const kbdPanel = document.getElementById("kbdPanel");
    const kbdInput = document.getElementById("kbdInput");
    const snapBtn = document.getElementById("snapBtn");
    const netStatsEl = document.getElementById("netStats");
    const remoteVideo = document.getElementById("remote");
    const remoteAudio = document.getElementById("remoteAudio");
    remoteVideo.muted = false;
    remoteVideo.volume = 1.0;
    remoteVideo.setAttribute("webkit-playsinline", "true");
    remoteAudio.muted = false;
    remoteAudio.volume = 1.0;

    const debugLines = [];
    const debug = (...a) => {
      const ts = new Date().toLocaleTimeString();
      debugLines.push(`[${ts}] ${a.join(" ")}`);
      while (debugLines.length > 180) debugLines.shift();
      console.log(debugLines[debugLines.length - 1]);
    };

    const log = (...a) => {
      const t = document.createElement("div");
      t.className = "toast";
      t.textContent = a.join(" ");
      toastWrap.appendChild(t);
      setTimeout(() => t.remove(), 2200);
      debug(...a);
    };

    const setBanner = (text, warn = false) => {
      banner.textContent = text;
      banner.classList.toggle("warn", warn);
      banner.style.display = "block";
      debug("banner:", text);
    };

    const hideBannerSoon = (ms = 1400) => setTimeout(() => { banner.style.display = "none"; }, ms);

    let ws;
    let pc;
    let inputChannel;
    let connectCode = "";
    let connectToken = "";
    let reconnectTimer = null;
    let reconnectAttempt = 0;
    let stoppedByAuthError = false;
    let stoppedByKick = false;
    let activeConnId = 0;
    let remoteDescSet = false;
    let pendingCandidates = [];
    let noTrackTimer = null;
    let trackReceived = false;
    let statsTimer = null;
    let lastVideoBytes = null;
    let lastStatsTs = null;
    let iceServers = [{ urls: "stun:stun.l.google.com:19302" }];

    let lastTapTs = 0;
    let lastTapX = 0;
    let lastTapY = 0;
    let pressTimer = null;
    let holdActive = false;
    let holdStartX = 0;
    let holdStartY = 0;
    let lastScrollY = 0;
    let movedWhileHold = false;
    let zoomed = false;

    function wsUrl() {
      const scheme = location.protocol === "https:" ? "wss" : "ws";
      return `${scheme}://${location.host}/ws`;
    }

    async function loadRuntimeConfig() {
      try {
        const res = await fetch("/api/pair", { cache: "no-store" });
        if (!res.ok) return;
        const payload = await res.json();
        if (Array.isArray(payload.iceServers) && payload.iceServers.length) {
          iceServers = payload.iceServers;
        }
      } catch {}
    }

    function tryOpenNativeApp(code, token) {
      const ua = navigator.userAgent || "";
      const isAndroid = /Android/i.test(ua);
      if (!isAndroid) return;
      const p = new URLSearchParams(location.search);
      if (p.get("native") === "0") return;
      const wantsNative = window.confirm("Uygulama yüklüyse uygulamada acilsin mi?");
      if (!wantsNative) {
        log("Web viewer secildi.");
        return;
      }
      const ws = wsUrl();
      const deepLink = `gameremote://connect?ws=${encodeURIComponent(ws)}&code=${encodeURIComponent(code)}&token=${encodeURIComponent(token)}`;
      const fallbackUrl = location.href + (location.search ? "&" : "?") + "native=0";

      log("Android app detected, trying native redirect...");
      let switched = false;
      const onHidden = () => { switched = true; };
      document.addEventListener("visibilitychange", onHidden, { once: true });
      setTimeout(() => {
        if (!switched && !document.hidden) {
          log("Native app not opened, continuing in web viewer.");
          location.replace(fallbackUrl);
        }
      }, 1100);

      // Avoid breaking the page with ERR_UNKNOWN_URL_SCHEME in browsers
      // that don't support direct top-level navigation for custom schemes.
      const iframe = document.createElement("iframe");
      iframe.style.display = "none";
      iframe.src = deepLink;
      document.body.appendChild(iframe);
      setTimeout(() => {
        try { iframe.remove(); } catch {}
      }, 900);
    }

    function clearReconnectTimer() {
      if (reconnectTimer) {
        clearTimeout(reconnectTimer);
        reconnectTimer = null;
        debug("clearReconnectTimer");
      }
    }

    function clearNoTrackTimer() {
      if (noTrackTimer) {
        clearTimeout(noTrackTimer);
        noTrackTimer = null;
        debug("clearNoTrackTimer");
      }
    }

    function isConnectionHealthy() {
      const wsOk = ws && ws.readyState === WebSocket.OPEN;
      const state = pc ? pc.connectionState : "";
      const pcOk = state === "connected" || state === "connecting";
      return Boolean(wsOk && pcOk);
    }

    function cleanupConnection() {
      debug("cleanupConnection");
      clearNoTrackTimer();
      stopStatsLoop();
      try {
        if (ws) {
          ws.onclose = null;
          ws.onerror = null;
          ws.onmessage = null;
          ws.close();
        }
      } catch {}
      try {
        if (pc) {
          pc.onconnectionstatechange = null;
          pc.onicecandidate = null;
          pc.ontrack = null;
          pc.ondatachannel = null;
          pc.close();
        }
      } catch {}
      ws = null;
      pc = null;
      inputChannel = null;
    }

    function scheduleReconnect(reason) {
      if (stoppedByAuthError || stoppedByKick) return;
      if (reconnectTimer) return;
      if (isConnectionHealthy()) return;
      reconnectAttempt += 1;
      const delay = Math.min(5000, 900 + reconnectAttempt * 350);
      setBanner("Baglanti koptu, tekrar baglaniyor...", true);
      log(reason || "Disconnected", `retry in ${delay}ms`);
      reconnectTimer = setTimeout(() => {
        reconnectTimer = null;
        if (isConnectionHealthy()) return;
        debug("reconnect timeout fired");
        connect(connectCode, connectToken).catch((e) => {
          debug("reconnect failed", e.message);
          scheduleReconnect("Reconnect error: " + e.message);
        });
      }, delay);
    }

    async function connect(code, token) {
      const connId = ++activeConnId;
      debug("connect", "connId=", connId, "code=", code);
      cleanupConnection();
      remoteDescSet = false;
      pendingCandidates = [];
      trackReceived = false;
      connectCode = code;
      connectToken = token;
      setBanner("Baglaniyor...");

      pc = new RTCPeerConnection({ iceServers });
      debug("pc created");

      pc.ontrack = (ev) => {
        if (connId !== activeConnId) return;
        const stream = ev.streams && ev.streams[0];
        const kind = ev.track && ev.track.kind ? ev.track.kind : "unknown";
        debug("pc.ontrack", "kind=", kind);
        if (!stream) return;
        const aCount = stream.getAudioTracks().length;
        const vCount = stream.getVideoTracks().length;
        debug("remote tracks", `video=${vCount}`, `audio=${aCount}`);
        remoteVideo.srcObject = stream;
        remoteAudio.srcObject = stream;
        remoteVideo.play().then(() => {
          debug("video.play():ok");
        }).catch((e) => {
          debug("video.play():fail", e.message);
        });
        remoteAudio.play().then(() => {
          debug("audio.play():ok");
        }).catch((e) => {
          debug("audio.play():fail", e.message);
        });
        if (!aCount) {
          log("No audio track received from PC");
        }
        trackReceived = true;
        startStatsLoop();
        clearNoTrackTimer();
        clearReconnectTimer();
        reconnectAttempt = 0;
        setBanner("Baglandi");
        hideBannerSoon();
        log("Connected");
      };

      pc.ondatachannel = (ev) => {
        if (connId !== activeConnId) return;
        debug("ondatachannel", ev.channel && ev.channel.label);
        if (ev.channel.label !== "input") return;
        inputChannel = ev.channel;
      };

      pc.onicecandidate = (ev) => {
        if (connId !== activeConnId) return;
        if (!ev.candidate) return;
        ws.send(JSON.stringify({ type: "signal", token, target: "pc", data: { candidate: ev.candidate } }));
      };

      pc.onconnectionstatechange = () => {
        if (connId !== activeConnId) return;
        const state = pc.connectionState;
        debug("pc.state", state);
        if (state === "failed" || state === "disconnected" || state === "closed") {
          scheduleReconnect("Peer state: " + state);
        }
      };
      pc.oniceconnectionstatechange = () => {
        if (connId !== activeConnId) return;
        debug("pc.ice", pc.iceConnectionState);
      };
      pc.onicegatheringstatechange = () => {
        if (connId !== activeConnId) return;
        debug("pc.gather", pc.iceGatheringState);
      };

      ws = new WebSocket(wsUrl());
      ws.onopen = () => {
        if (connId !== activeConnId) return;
        debug("ws.onopen");
        clearReconnectTimer();
        clearNoTrackTimer();
        noTrackTimer = setTimeout(() => {
          if (connId !== activeConnId) return;
          if (trackReceived) return;
          debug("no track timeout");
          scheduleReconnect("No track timeout");
        }, 7000);
        ws.send(JSON.stringify({ type: "register", role: "android", code, token }));
      };

      ws.onmessage = async (ev) => {
        if (connId !== activeConnId) return;
        let msg;
        try {
          msg = JSON.parse(ev.data);
        } catch (e) {
          debug("ws parse error", e.message);
          return;
        }
        debug("ws.msg", msg.type || "unknown");

        if (msg.type === "kicked") {
          stoppedByKick = true;
          setBanner("Oturum yenilendi, tekrar baglaniyor...", true);
          debug("kicked -> stop reconnect");
          return;
        }

        if (msg.type === "signal" && msg.data?.sdp) {
          debug("signal.sdp", msg.data.sdp.type);
          try {
            debug("setRemoteDescription:start");
            await pc.setRemoteDescription(new RTCSessionDescription(msg.data.sdp));
            debug("setRemoteDescription:ok");
          } catch (e) {
            debug("setRemoteDescription:fail", e.message);
            scheduleReconnect("setRemoteDescription failed");
            return;
          }
          remoteDescSet = true;
          if (pendingCandidates.length) {
            debug("flush candidates", pendingCandidates.length);
            for (const c of pendingCandidates) {
              try {
                await pc.addIceCandidate(new RTCIceCandidate(c));
                debug("addIceCandidate:queued:ok");
              } catch (e) {
                debug("addIceCandidate:queued:fail", e.message);
              }
            }
            pendingCandidates = [];
          }
          if (msg.data.sdp.type === "offer") {
            try {
              debug("createAnswer:start");
              const answer = await pc.createAnswer();
              debug("createAnswer:ok");
              debug("setLocalDescription:start");
              await pc.setLocalDescription(answer);
              debug("setLocalDescription:ok");
              ws.send(JSON.stringify({ type: "signal", token, target: "pc", data: { sdp: pc.localDescription } }));
              clearReconnectTimer();
              reconnectAttempt = 0;
              debug("answer sent");
            } catch (e) {
              debug("answer flow fail", e.message);
              scheduleReconnect("answer flow failed");
            }
          }
          return;
        }

        if (msg.type === "signal" && msg.data?.candidate) {
          if (!remoteDescSet) {
            pendingCandidates.push(msg.data.candidate);
            debug("queue candidate", pendingCandidates.length);
          } else {
            try {
              await pc.addIceCandidate(new RTCIceCandidate(msg.data.candidate));
              debug("addIceCandidate:ok");
            } catch (e) {
              debug("addIceCandidate:fail", e.message);
            }
          }
          return;
        }

        if (msg.type === "error") {
          const m = msg.message || "Unknown signaling error";
          log("ERROR:", m);
          if (m.toLowerCase().includes("pc must register first")) {
            setBanner("PC yayin acilmadi, bekleniyor...", true);
            return;
          }
          if (m.toLowerCase().includes("invalid token") || m.toLowerCase().includes("invalid code")) {
            stoppedByAuthError = true;
            setBanner("Oturum gecersiz veya sona erdi. Yeni QR/link alin.", true);
          }
        }
      };

      ws.onclose = (ev) => {
        if (connId !== activeConnId) return;
        debug("ws.onclose", "code=", ev && ev.code, "reason=", ev && ev.reason);
        if (ev && ev.code === 4001) {
          stoppedByKick = true;
          setBanner("Oturum yenilendi, tekrar baglaniyor...", true);
          debug("close 4001 -> stop reconnect");
          return;
        }
        scheduleReconnect("Signaling closed");
      };

      ws.onerror = () => {
        if (connId !== activeConnId) return;
        debug("ws.onerror");
        scheduleReconnect("Signaling error");
      };
    }

    function stopStatsLoop() {
      if (statsTimer) {
        clearInterval(statsTimer);
        statsTimer = null;
      }
      lastVideoBytes = null;
      lastStatsTs = null;
      netStatsEl.textContent = "bitrate=- | fps=- | rtt=- | loss=-";
    }

    function startStatsLoop() {
      if (statsTimer) return;
      statsTimer = setInterval(async () => {
        if (!pc || pc.connectionState === "closed") return;
        try {
          const stats = await pc.getStats();
          let inVideo = null;
          let remoteOutVideo = null;
          let pair = null;
          stats.forEach((r) => {
            if (r.type === "inbound-rtp" && r.kind === "video" && !r.isRemote) inVideo = r;
            if (r.type === "remote-outbound-rtp" && r.kind === "video") remoteOutVideo = r;
            if (r.type === "candidate-pair" && r.nominated && r.state === "succeeded") pair = r;
          });

          let bitrateText = "-";
          let fpsText = "-";
          let rttText = "-";
          let lossText = "-";

          const now = Date.now();
          if (inVideo && typeof inVideo.bytesReceived === "number") {
            if (lastVideoBytes != null && lastStatsTs != null) {
              const dt = (now - lastStatsTs) / 1000;
              if (dt > 0) {
                const bps = ((inVideo.bytesReceived - lastVideoBytes) * 8) / dt;
                bitrateText = `${Math.max(0, bps / 1000).toFixed(0)}kbps`;
              }
            }
            lastVideoBytes = inVideo.bytesReceived;
            lastStatsTs = now;
            if (Number.isFinite(inVideo.framesPerSecond)) {
              fpsText = `${inVideo.framesPerSecond.toFixed(1)}`;
            }
          }

          const rtt = (pair && pair.currentRoundTripTime) || (remoteOutVideo && remoteOutVideo.roundTripTime);
          if (Number.isFinite(rtt)) rttText = `${Math.round(rtt * 1000)}ms`;

          if (inVideo && Number.isFinite(inVideo.packetsLost) && Number.isFinite(inVideo.packetsReceived)) {
            const total = inVideo.packetsReceived + inVideo.packetsLost;
            const lossPct = total > 0 ? (inVideo.packetsLost / total) * 100 : 0;
            lossText = `${lossPct.toFixed(1)}%`;
          }

          netStatsEl.textContent = `bitrate=${bitrateText} | fps=${fpsText} | rtt=${rttText} | loss=${lossText}`;
        } catch {}
      }, 2000);
    }

    function mapPointToVideo(clientX, clientY) {
      const video = document.getElementById("remote");
      const rect = video.getBoundingClientRect();
      if (!rect.width || !rect.height || !video.videoWidth || !video.videoHeight) return null;
      const videoAspect = video.videoWidth / video.videoHeight;
      const boxAspect = rect.width / rect.height;

      let drawW, drawH, offsetX, offsetY;
      if (videoAspect > boxAspect) {
        drawW = rect.width;
        drawH = rect.width / videoAspect;
        offsetX = 0;
        offsetY = (rect.height - drawH) / 2;
      } else {
        drawH = rect.height;
        drawW = rect.height * videoAspect;
        offsetY = 0;
        offsetX = (rect.width - drawW) / 2;
      }
      const px = clientX - rect.left - offsetX;
      const py = clientY - rect.top - offsetY;
      const x = px / drawW;
      const y = py / drawH;
      if (!Number.isFinite(x) || !Number.isFinite(y)) return null;
      return { x: Math.max(0, Math.min(1, x)), y: Math.max(0, Math.min(1, y)) };
    }

    function sendTap(clientX, clientY, button = "left") {
      if (!inputChannel || inputChannel.readyState !== "open") return;
      const pt = mapPointToVideo(clientX, clientY);
      if (!pt) return;
      inputChannel.send(JSON.stringify({ type: "input", command: "tap", params: { x: pt.x, y: pt.y, button } }));
      showRipple(clientX, clientY, button);
    }

    function sendScroll(delta) {
      if (!inputChannel || inputChannel.readyState !== "open") return;
      if (!delta) return;
      inputChannel.send(JSON.stringify({ type: "input", command: "scroll", params: { delta } }));
    }

    function sendText(text) {
      if (!inputChannel || inputChannel.readyState !== "open") return;
      const value = (text || "").trim();
      if (!value) return;
      inputChannel.send(JSON.stringify({ type: "input", command: "text", params: { text: value } }));
      log("Text sent");
    }

    function showRipple(x, y, button = "left") {
      const el = document.createElement("div");
      el.className = button === "right" ? "ripple right" : "ripple";
      el.style.left = `${x}px`;
      el.style.top = `${y}px`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 450);
    }

    function takeScreenshot() {
      if (!remoteVideo.videoWidth || !remoteVideo.videoHeight) {
        log("Screenshot failed: no video frame yet");
        return;
      }
      const canvas = document.createElement("canvas");
      canvas.width = remoteVideo.videoWidth;
      canvas.height = remoteVideo.videoHeight;
      const ctx = canvas.getContext("2d");
      if (!ctx) {
        log("Screenshot failed: canvas not available");
        return;
      }
      ctx.drawImage(remoteVideo, 0, 0, canvas.width, canvas.height);
      const stamp = new Date().toISOString().replace(/[:.]/g, "-");
      const filename = `remote-full-${stamp}.png`;
      const dataUrl = canvas.toDataURL("image/png");
      if (window.AndroidBridge && typeof window.AndroidBridge.saveImage === "function") {
        try {
          window.AndroidBridge.saveImage(dataUrl, filename);
          log(`Saved: ${filename} (Downloads)`);
          return;
        } catch {}
      }
      canvas.toBlob((blob) => {
        if (!blob) {
          log("Screenshot failed: empty image");
          return;
        }
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        log(`Saved: ${filename} (check Downloads / browser downloads)`);
      }, "image/png");
    }

    function toggleZoomAt(clientX, clientY) {
      const video = document.getElementById("remote");
      const rect = video.getBoundingClientRect();
      if (!rect.width || !rect.height) return;
      if (!zoomed) {
        const zx = ((clientX - rect.left) / rect.width) * 100;
        const zy = ((clientY - rect.top) / rect.height) * 100;
        video.style.transformOrigin = `${zx}% ${zy}%`;
        video.style.transform = "scale(2)";
        zoomed = true;
        log("Zoom x2");
      } else {
        video.style.transform = "scale(1)";
        video.style.transformOrigin = "50% 50%";
        zoomed = false;
        log("Zoom reset");
      }
    }

    if (window.PointerEvent) {
      remoteVideo.addEventListener("pointerdown", (ev) => {
        if (remoteVideo.paused) {
          remoteVideo.play().catch(() => {});
        }
        if (remoteAudio.paused) {
          remoteAudio.play().catch(() => {});
        }
        holdActive = false;
        movedWhileHold = false;
        holdStartX = ev.clientX;
        holdStartY = ev.clientY;
        lastScrollY = ev.clientY;
        clearTimeout(pressTimer);
        pressTimer = setTimeout(() => {
          holdActive = true;
          log("Hold mode");
        }, 420);
        ev.preventDefault();
      });

      remoteVideo.addEventListener("pointermove", (ev) => {
        if (!holdActive) return;
        const dy = ev.clientY - lastScrollY;
        if (Math.abs(dy) >= 18) {
          const steps = Math.trunc(dy / 18);
          if (steps !== 0) {
            sendScroll(-steps);
            lastScrollY += steps * 18;
            movedWhileHold = true;
          }
        }
        ev.preventDefault();
      });

      remoteVideo.addEventListener("pointerup", (ev) => {
        clearTimeout(pressTimer);
        if (holdActive) {
          const travel = Math.hypot(ev.clientX - holdStartX, ev.clientY - holdStartY);
          if (!movedWhileHold && travel < 12) sendTap(ev.clientX, ev.clientY, "right");
          holdActive = false;
          ev.preventDefault();
          return;
        }
        const now = Date.now();
        const dx = Math.abs(ev.clientX - lastTapX);
        const dy = Math.abs(ev.clientY - lastTapY);
        if (now - lastTapTs < 280 && dx < 28 && dy < 28) {
          toggleZoomAt(ev.clientX, ev.clientY);
          lastTapTs = 0;
        } else {
          sendTap(ev.clientX, ev.clientY, "left");
          lastTapTs = now;
          lastTapX = ev.clientX;
          lastTapY = ev.clientY;
        }
        ev.preventDefault();
      });
      remoteVideo.addEventListener("pointercancel", () => clearTimeout(pressTimer));
    } else {
      remoteVideo.addEventListener("touchstart", (ev) => {
        if (remoteVideo.paused) {
          remoteVideo.play().catch(() => {});
        }
        if (remoteAudio.paused) {
          remoteAudio.play().catch(() => {});
        }
        const t = ev.changedTouches && ev.changedTouches[0];
        if (!t) return;
        holdActive = false;
        movedWhileHold = false;
        holdStartX = t.clientX;
        holdStartY = t.clientY;
        lastScrollY = t.clientY;
        clearTimeout(pressTimer);
        pressTimer = setTimeout(() => {
          holdActive = true;
          log("Hold mode");
        }, 420);
        const now = Date.now();
        const dx = Math.abs(t.clientX - lastTapX);
        const dy = Math.abs(t.clientY - lastTapY);
        if (now - lastTapTs < 280 && dx < 28 && dy < 28) {
          clearTimeout(pressTimer);
          toggleZoomAt(t.clientX, t.clientY);
          lastTapTs = 0;
          holdActive = true;
        } else {
          lastTapTs = now;
          lastTapX = t.clientX;
          lastTapY = t.clientY;
        }
        ev.preventDefault();
      }, { passive: false });

      remoteVideo.addEventListener("touchmove", (ev) => {
        if (!holdActive) return;
        const t = ev.changedTouches && ev.changedTouches[0];
        if (!t) return;
        const dy = t.clientY - lastScrollY;
        if (Math.abs(dy) >= 18) {
          const steps = Math.trunc(dy / 18);
          if (steps !== 0) {
            sendScroll(-steps);
            lastScrollY += steps * 18;
            movedWhileHold = true;
          }
        }
        ev.preventDefault();
      }, { passive: false });

      remoteVideo.addEventListener("touchend", (ev) => {
        clearTimeout(pressTimer);
        if (holdActive) {
          const t = ev.changedTouches && ev.changedTouches[0];
          if (t) {
            const travel = Math.hypot(t.clientX - holdStartX, t.clientY - holdStartY);
            if (!movedWhileHold && travel < 12) sendTap(t.clientX, t.clientY, "right");
          }
          holdActive = false;
          ev.preventDefault();
          return;
        }
        const t = ev.changedTouches && ev.changedTouches[0];
        if (!t) return;
        sendTap(t.clientX, t.clientY, "left");
        ev.preventDefault();
      }, { passive: false });
    }

    document.getElementById("kbdToggle").addEventListener("click", () => {
      const open = kbdPanel.style.display === "grid";
      kbdPanel.style.display = open ? "none" : "grid";
      if (!open) setTimeout(() => kbdInput.focus(), 80);
    });
    snapBtn.addEventListener("click", takeScreenshot);
    document.getElementById("kbdSend").addEventListener("click", () => {
      sendText(kbdInput.value);
      kbdInput.value = "";
      kbdInput.focus();
    });
    kbdInput.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter") {
        sendText(kbdInput.value);
        kbdInput.value = "";
        ev.preventDefault();
      }
    });

    remoteVideo.addEventListener("loadedmetadata", () => {
      debug("video.loadedmetadata", remoteVideo.videoWidth + "x" + remoteVideo.videoHeight);
    });
    remoteVideo.addEventListener("playing", () => {
      debug("video.playing");
    });
    remoteVideo.addEventListener("waiting", () => {
      debug("video.waiting");
    });
    remoteVideo.addEventListener("stalled", () => {
      debug("video.stalled");
    });
    remoteVideo.addEventListener("error", () => {
      debug("video.error");
    });

    (function boot() {
      const p = new URLSearchParams(location.search);
      const code = p.get("code") || "";
      const token = p.get("token") || "";
      if (!/^\d{6}$/.test(code) || token.length < 4) {
        log("Missing/invalid code or token.");
        setBanner("Gecersiz code/token", true);
        return;
      }
      tryOpenNativeApp(code, token);
      loadRuntimeConfig().finally(() => {
        connect(code, token).catch((e) => log("Connect failed:", e.message));
      });
    })();

    window.addEventListener("pagehide", () => {
      stoppedByAuthError = true;
      cleanupConnection();
    });
  </script>
</body>
</html>
