services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.prod
    expose:
      - "37841"
    networks:
      - appnet

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    env_file:
      - .env.prod
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - appnet

  coturn:
    image: coturn/coturn:4.6.3-r2
    restart: unless-stopped
    env_file:
      - .env.prod
    command:
      - /bin/sh
      - -ec
      - |
        cat >/tmp/turnserver.conf <<EOF
        listening-port=3478
        tls-listening-port=5349
        min-port=49160
        max-port=49200
        listening-ip=0.0.0.0
        external-ip=$${TURN_EXTERNAL_IP}
        fingerprint
        lt-cred-mech
        realm=$${TURN_REALM}
        user=$${TURN_USERNAME}:$${TURN_PASSWORD}
        no-multicast-peers
        no-cli
        simple-log
        no-software-attribute
        EOF
        exec turnserver -c /tmp/turnserver.conf
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "5349:5349"
      - "5349:5349/udp"
      - "49160-49200:49160-49200/udp"
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
